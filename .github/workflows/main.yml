  deploy:
    name: Deploy to EC2
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify required secrets are set
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY AI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Required deployment secrets are missing."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: AI_API_KEY
          script: |
            set -euo pipefail

            PROJECT_PATH="$HOME/Interviwe_plat"
            REPOSITORY_URL="https://github.com/g2rindian2005-cyber/Interviwe_plat.git"

            mkdir -p "$HOME"

            if [ ! -d "$PROJECT_PATH/.git" ]; then
              if [ -e "$PROJECT_PATH" ] && [ "$(find "$PROJECT_PATH" -mindepth 1 -maxdepth 1 | head -n 1)" ]; then
                echo "Removing incomplete deployment directory: $PROJECT_PATH"
                rm -rf "$PROJECT_PATH"
              fi
              echo "Cloning repository..."
              git clone "$REPOSITORY_URL" "$PROJECT_PATH"
            fi

            cd "$PROJECT_PATH"
            git fetch origin main
            git reset --hard origin/main

            # Update AI_API_KEY in backend/.env without overwriting other env vars
            if [ ! -f backend/.env ]; then
              cat > backend/.env <<EOF
NODE_ENV=production
PORT=5000
AI_API_KEY=$AI_API_KEY
EOF
            else
              AI_API_KEY="$AI_API_KEY" node <<'NODE'
const fs = require('fs');
const path = 'backend/.env';
const value = process.env.AI_API_KEY || '';
let text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
const line = `AI_API_KEY=${value}`;
if (/^AI_API_KEY=.*$/m.test(text)) text = text.replace(/^AI_API_KEY=.*$/m, line);
else text += (text.endsWith('\n') || text.length === 0 ? '' : '\n') + line + '\n';
fs.writeFileSync(path, text);
NODE
            fi

            echo "Installing and restarting backend..."
            cd backend
            npm install --omit=dev
            if pm2 describe devopsai-backend >/dev/null 2>&1; then
              pm2 restart devopsai-backend --update-env
            else
              pm2 start server.js --name devopsai-backend
            fi
            pm2 save

            echo "Building frontend..."
            cd ../frontend
            npm install
            npm run build

            echo "Publishing frontend build to nginx..."
            sudo mkdir -p /var/www/devopsai
            sudo rm -rf /var/www/devopsai/*
            sudo cp -r dist/. /var/www/devopsai/

            echo "Checking backend health..."
            cd ..
            for i in $(seq 1 20); do
              if curl --fail --silent http://localhost:5000/api/health; then
                echo "Backend is healthy."
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "Backend did not become healthy after deploy."
                pm2 logs devopsai-backend --lines 50 --nostream || true
                exit 1
              fi
              sleep 3
            done

            echo "Deploy finished."
